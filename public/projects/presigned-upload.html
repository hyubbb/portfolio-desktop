<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파일 업로드 경로 바꾸기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="case.css">
<style>
/* 파일이 지나가는 길을 그림으로: 도입 전은 앱 서버를 거치고, 도입 후는 스토리지로 바로 간다 */
.flow{width:100%;height:auto;display:block}
.flow .node rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.flow .node text{fill:var(--ink);font:600 13px var(--f-body)}
.flow .node .sub{fill:var(--muted);font:11px var(--f-body)}
.flow .node.on rect{stroke-width:2.5}
.flow .before .node.on rect{stroke:var(--before)}
.flow .after .node.on rect{stroke:var(--after)}
.flow path.route{fill:none;stroke:var(--line);stroke-width:2}
.flow path.route.big{stroke-width:5}
.flow path.route.active{stroke:currentColor}
.flow .label{font:11px var(--f-mono);fill:var(--muted)}
.flow circle.packet{fill:currentColor}
.side.before-side{color:var(--before)}
.side.after-side{color:var(--after)}
.side > *{color:var(--ink)}
.side svg{color:inherit}
.progress-row{display:flex;align-items:center;gap:10px;font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
.progress-row .bar{flex:1}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--before);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1 data-i="h1"></h1>
    <p class="lede" data-i-html="lede"></p>
  </header>

  <section class="results">
    <div class="result"><span class="label" data-i="r1Label"></span><span class="value"><span class="from" data-i="r1From"></span><span class="arrow">→</span><span class="to" data-i="r1To"></span></span></div>
    <div class="result"><span class="label" data-i="r2Label"></span><span class="value"><span class="from" data-i="r2From"></span><span class="arrow">→</span><span class="to" data-i="r2To"></span></span></div>
    <div class="result"><span class="label" data-i="r3Label"></span><span class="value"><span class="from" data-i="r3From"></span><span class="arrow">→</span><span class="to" data-i="r3To"></span></span></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2 data-i="simTitle"></h2>
      <div class="controls">
        <button class="primary" id="play" type="button" data-i="replay"></button>
        <span class="clock" id="clock">0.0s</span>
      </div>
    </div>
    <div class="sides">
      <div class="side before-side">
        <div class="side-head"><b data-i="before"></b><span class="tag before" data-i="beforeHow"></span></div>
        <svg class="flow" viewBox="0 0 420 200" role="img" aria-labelledby="b-flow-title"><title id="b-flow-title" data-i="beforeHow"></title><g class="before" id="b-svg"></g></svg>
        <div class="progress-row" id="b-progress"></div>
        <ol class="log" id="b-log"></ol>
      </div>
      <div class="side after-side">
        <div class="side-head"><b data-i="after"></b><span class="tag after" data-i="afterHow"></span></div>
        <svg class="flow" viewBox="0 0 420 200" role="img" aria-labelledby="a-flow-title"><title id="a-flow-title" data-i="afterHow"></title><g class="after" id="a-svg"></g></svg>
        <div class="progress-row" id="a-progress"></div>
        <ol class="log" id="a-log"></ol>
      </div>
    </div>
    <p class="note" data-i="simNote"></p>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px">
    <h2 data-i="changesTitle"></h2>
    <div class="changes">
      <div class="change"><h3 data-i="c1t"></h3><p data-i-html="c1"></p></div>
      <div class="change"><h3 data-i="c2t"></h3><p data-i-html="c2"></p></div>
      <div class="change"><h3 data-i="c3t"></h3><p data-i-html="c3"></p></div>
    </div>
  </section>
  <p class="note" data-i="note"></p>
</div>

<script src="case.js"></script>
<script>
(function () {
  var t = Case.init({
    ko: {
      title: "파일 업로드 경로 바꾸기",
      eyebrow: "Presigned URL · 직접 업로드",
      h1: "파일 업로드, 30초에서 3초로",
      lede: "파일을 올리면 브라우저가 파일을 통째로 변환해 앱 서버(Server Action)로 보내고, 서버가 다시 스토리지로 올렸습니다. 같은 파일이 두 번 오가는 동안 사용자는 진행률도 모른 채 기다려야 했습니다.<br class=\"wide-br\"> 서버는 \"이 경로에 올려도 된다\"는 서명된 URL만 발급하고, 파일은 브라우저가 스토리지로 바로 올리도록 길을 바꿨습니다.",
      r1Label: "업로드 시간", r1From: "30~40초", r1To: "3~4초",
      r2Label: "파일이 지나가는 길", r2From: "앱 서버 경유", r2To: "스토리지 직행",
      r3Label: "진행 상황", r3From: "로딩만 표시", r3To: "0~100% 표시",
      simTitle: "같은 파일을 올리는 두 방식", replay: "다시 재생",
      before: "도입 전", after: "도입 후",
      beforeHow: "브라우저 → 앱 서버 → 스토리지", afterHow: "브라우저 → 스토리지 (서명된 URL)",
      browser: "브라우저", server: "앱 서버", storage: "스토리지",
      serverSubBefore: "Server Action", serverSubAfter: "URL 발급·완료 처리",
      uploading: "업로드 중…", doneIn: "완료 · {s}초",
      lConvert: "File → ArrayBuffer 변환", lToServer: "앱 서버로 파일 전송", lToStorage: "앱 서버 → 스토리지 업로드", lDone: "완료 응답",
      lAskUrl: "서명된 URL 요청 (작은 요청)", lGotUrl: "서명된 URL 받음", lPut: "스토리지로 직접 PUT (XHR)", lPct: "진행률 {p}%", lComplete: "업로드 완료 알림 → 파일 등록",
      pUrl: "URL 요청", pFile: "파일", pDone: "완료",
      simNote: "시간은 5배 빠르게 돌렸습니다. 업로드 시간(30~40초 → 3~4초)은 실제 측정값이고, 그림 속 단계 나눔은 설명을 위해 단순화했습니다.",
      changesTitle: "무엇을 바꿨나",
      c1t: "서버는 URL만 발급", c1: "앱 서버는 파일을 받지 않고, 정해진 경로에 정해진 시간 동안만 올릴 수 있는 서명된 URL(presigned URL)만 만들어 줍니다. 파일 데이터가 서버를 거치지 않아 서버 부하와 왕복 시간이 함께 줄었습니다.",
      c2t: "XHR로 직접 올리고 진행률 표시", c2: "<code>fetch</code>는 업로드 진행률을 알려 주지 않아 <code>XMLHttpRequest</code>의 <code>upload.onprogress</code>로 0~100%를 보여 줍니다. File을 ArrayBuffer로 바꾸지 않고 그대로 보내고, <code>AbortSignal</code>로 중간에 취소할 수 있게 했습니다.",
      c3t: "완료 알림과 공통 유틸", c3: "업로드가 끝나면 완료 API로 파일을 등록합니다. 이 흐름을 <code>uploadFileDirectly</code> 유틸로 묶어 강의 영상, 과제, 이미지 등 여러 업로드 화면에서 같이 씁니다.",
      note: "사내 코드를 바탕으로 정리했습니다. 서비스 이름과 내부 주소는 넣지 않았습니다."
    },
    ja: {
      title: "ファイルアップロード経路の変更",
      eyebrow: "Presigned URL · 直接アップロード",
      h1: "ファイルアップロード、30 秒から 3 秒へ",
      lede: "ファイルをアップロードすると、ブラウザがファイル全体を変換してアプリサーバー(Server Action)へ送り、サーバーが改めてストレージへ上げていました。同じファイルが 2 回行き来する間、ユーザーは進捗もわからないまま待つしかありませんでした。<br class=\"wide-br\">サーバーは「この場所に上げてよい」という署名付き URL だけを発行し、ファイルはブラウザからストレージへ直接上げるように経路を変えました。",
      r1Label: "アップロード時間", r1From: "30〜40 秒", r1To: "3〜4 秒",
      r2Label: "ファイルの通り道", r2From: "アプリサーバー経由", r2To: "ストレージ直行",
      r3Label: "進捗表示", r3From: "ローディングのみ", r3To: "0〜100% を表示",
      simTitle: "同じファイルを上げる 2 つの方法", replay: "もう一度再生",
      before: "導入前", after: "導入後",
      beforeHow: "ブラウザ → アプリサーバー → ストレージ", afterHow: "ブラウザ → ストレージ(署名付き URL)",
      browser: "ブラウザ", server: "アプリサーバー", storage: "ストレージ",
      serverSubBefore: "Server Action", serverSubAfter: "URL 発行・完了処理",
      uploading: "アップロード中…", doneIn: "完了 · {s} 秒",
      lConvert: "File → ArrayBuffer に変換", lToServer: "アプリサーバーへファイル送信", lToStorage: "アプリサーバー → ストレージへアップロード", lDone: "完了レスポンス",
      lAskUrl: "署名付き URL を要求(小さなリクエスト)", lGotUrl: "署名付き URL を受信", lPut: "ストレージへ直接 PUT (XHR)", lPct: "進捗 {p}%", lComplete: "アップロード完了を通知 → ファイル登録",
      pUrl: "URL 要求", pFile: "ファイル", pDone: "完了",
      simNote: "時間は 5 倍速にしています。アップロード時間(30〜40 秒 → 3〜4 秒)は実測値で、図の段階分けは説明のために単純化しています。",
      changesTitle: "何を変えたか",
      c1t: "サーバーは URL を発行するだけ", c1: "アプリサーバーはファイルを受け取らず、決められた場所に決められた時間だけアップロードできる署名付き URL(presigned URL)を作るだけです。ファイルデータがサーバーを通らないため、サーバー負荷と往復時間がともに減りました。",
      c2t: "XHR で直接アップロードし進捗を表示", c2: "<code>fetch</code> はアップロードの進捗を返さないため、<code>XMLHttpRequest</code> の <code>upload.onprogress</code> で 0〜100% を表示します。File を ArrayBuffer に変換せずそのまま送り、<code>AbortSignal</code> で途中キャンセルもできるようにしました。",
      c3t: "完了通知と共通ユーティリティ", c3: "アップロードが終わると完了 API でファイルを登録します。この流れを <code>uploadFileDirectly</code> ユーティリティにまとめ、講義動画、課題、画像など複数のアップロード画面で共通利用しています。",
      note: "社内コードをもとに整理しました。サービス名と内部アドレスは載せていません。"
    }
  });

  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  var SPEED = 5;

  function el(name, attrs, parent, text) {
    var n = document.createElementNS(NS, name);
    Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (text != null) n.textContent = text;
    parent.appendChild(n);
    return n;
  }
  function node(g, x, y, title, sub) {
    var grp = el("g", { class: "node" }, g);
    el("rect", { x: x, y: y, width: 120, height: 52, rx: 10 }, grp);
    el("text", { x: x + 12, y: y + 22 }, grp, title);
    el("text", { x: x + 12, y: y + 40, class: "sub" }, grp, sub);
    return grp;
  }
  function route(g, d, big) { return el("path", { d: d, class: "route" + (big ? " big" : "") }, g); }

  // 공통 배치: 브라우저(왼쪽 아래), 앱 서버(가운데 위), 스토리지(오른쪽 아래)
  function draw(id, after) {
    var g = $(id);
    g.textContent = "";
    var routes = after
      ? { ask: route(g, "M 80 130 C 80 70, 130 46, 150 46"), back: route(g, "M 150 62 C 120 70, 100 100, 98 130"), put: route(g, "M 130 156 L 290 156", true), done: route(g, "M 120 140 C 160 110, 180 90, 200 74") }
      : { toServer: route(g, "M 80 130 C 80 80, 120 50, 150 46", true), toStorage: route(g, "M 270 46 C 310 50, 350 80, 350 130", true) };
    var nodes = {
      browser: node(g, 10, 130, t("browser"), "File"),
      server: node(g, 150, 20, t("server"), t(after ? "serverSubAfter" : "serverSubBefore")),
      storage: node(g, 290, 130, t("storage"), "S3")
    };
    var packet = el("circle", { r: 7, class: "packet", opacity: 0 }, g);
    return { routes: routes, nodes: nodes, packet: packet };
  }
  function at(path, p) { var len = path.getTotalLength(); return path.getPointAtLength(len * Math.max(0, Math.min(1, p))); }
  function move(scene, path, p, r) {
    var pt = at(path, p);
    scene.packet.setAttribute("cx", pt.x); scene.packet.setAttribute("cy", pt.y);
    scene.packet.setAttribute("r", r); scene.packet.setAttribute("opacity", 1);
    Object.keys(scene.routes).forEach(function (k) { scene.routes[k].classList.toggle("active", scene.routes[k] === path); });
  }
  function light(scene, which) { Object.keys(scene.nodes).forEach(function (k) { scene.nodes[k].classList.toggle("on", k === which); }); }

  // 실제 초 단위 일정
  var BEFORE = [
    { from: 0, to: 4, step: "convert" },
    { from: 4, to: 20, step: "toServer" },
    { from: 20, to: 34, step: "toStorage" },
    { from: 34, to: 35, step: "done" }
  ];
  var AFTER = [
    { from: 0, to: 0.3, step: "ask" },
    { from: 0.3, to: 0.6, step: "back" },
    { from: 0.6, to: 3.2, step: "put" },
    { from: 3.2, to: 3.5, step: "done" }
  ];
  var END = 36;

  var b, a, start, raf, logged;

  function progressRow(id, html) { $(id).innerHTML = html; }
  function reset() {
    cancelAnimationFrame(raf);
    b = draw("b-svg", false);
    a = draw("a-svg", true);
    $("b-log").textContent = ""; $("a-log").textContent = "";
    logged = {};
    progressRow("b-progress", '<span class="spinner"></span><span>' + t("uploading") + "</span>");
    progressRow("a-progress", '<div class="bar"><i id="a-bar"></i></div><span id="a-pct">0%</span>');
  }
  function once(key, list, T, text, tone) { if (logged[key]) return; logged[key] = true; Case.log(list, (T.toFixed(1) + "s").padStart(5, " "), text, tone); }
  function phase(plan, T) { for (var i = 0; i < plan.length; i++) if (T < plan[i].to) return { p: plan[i], f: (T - plan[i].from) / (plan[i].to - plan[i].from) }; return null; }

  function step(T) {
    var bl = $("b-log"), al = $("a-log");
    var bp = phase(BEFORE, T);
    if (bp) {
      if (bp.p.step === "convert") { light(b, "browser"); once("b1", bl, bp.p.from, t("lConvert")); b.packet.setAttribute("opacity", 0); }
      if (bp.p.step === "toServer") { light(b, "server"); once("b2", bl, bp.p.from, t("lToServer")); move(b, b.routes.toServer, bp.f, 9); }
      if (bp.p.step === "toStorage") { light(b, "storage"); once("b3", bl, bp.p.from, t("lToStorage")); move(b, b.routes.toStorage, bp.f, 9); }
    } else if (!logged.b4) {
      once("b4", bl, 35, t("lDone"), "good");
      light(b, null); b.packet.setAttribute("opacity", 0);
      progressRow("b-progress", '<span class="tag before">' + t("doneIn", { s: 35 }) + "</span>");
    }
    var ap = phase(AFTER, T);
    if (ap) {
      if (ap.p.step === "ask") { light(a, "server"); once("a1", al, ap.p.from, t("lAskUrl")); move(a, a.routes.ask, ap.f, 4); }
      if (ap.p.step === "back") { light(a, "browser"); once("a2", al, ap.p.from, t("lGotUrl")); move(a, a.routes.back, ap.f, 4); }
      if (ap.p.step === "put") {
        light(a, "storage"); once("a3", al, ap.p.from, t("lPut"), "info"); move(a, a.routes.put, ap.f, 9);
        var pct = Math.round(ap.f * 100);
        var bar = $("a-bar"); if (bar) { bar.style.width = pct + "%"; $("a-pct").textContent = pct + "%"; }
        [25, 50, 75].forEach(function (m) { if (pct >= m) once("pct" + m, al, ap.p.from + (ap.p.to - ap.p.from) * m / 100, t("lPct", { p: m })); });
      }
      if (ap.p.step === "done") { light(a, "server"); move(a, a.routes.done, ap.f, 4); }
    } else if (!logged.a4) {
      once("a4", al, 3.5, t("lComplete"), "good");
      light(a, null); a.packet.setAttribute("opacity", 0);
      progressRow("a-progress", '<span class="tag after">' + t("doneIn", { s: 3.5 }) + "</span>");
    }
    $("clock").textContent = Math.min(T, END).toFixed(1) + "s";
  }
  function frame(now) {
    var T = ((now - start) / 1000) * SPEED;
    step(Math.min(T, END));
    if (T < END) raf = requestAnimationFrame(frame);
  }
  function play() {
    reset();
    if (Case.reduceMotion) { for (var T = 0; T <= END; T += 0.1) step(T); return; }
    start = performance.now();
    raf = requestAnimationFrame(frame);
  }
  $("play").addEventListener("click", play);
  play();
})();
</script>
</body>
</html>
