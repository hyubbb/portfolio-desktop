<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 답변 스트리밍 안정화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="case.css">
<style>
/* 서버가 보낸 청크 줄 → 도입 전/후 두 클라이언트가 같은 이벤트를 다르게 처리하는 모습 */
.wire{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center}
.chip{font:600 12px var(--f-mono);padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.sent{color:var(--ink)}
.chip.dup{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.lost{border-style:dashed;color:var(--before);background:transparent;text-decoration:line-through}
.chip.resumed{background:var(--after-soft);color:var(--after);border-color:transparent}
.chip.event{background:var(--track);color:var(--muted)}
.chip.down{background:var(--before-soft);color:var(--before);border-color:transparent}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:10px 12px;min-height:88px;font-size:14.5px;line-height:1.7}
.bubble .dup{background:var(--warn-soft);color:var(--warn);border-radius:3px}
.bubble .gap{color:var(--before);font-family:var(--f-mono);font-size:12px}
.bubble .resumed{background:var(--after-soft);border-radius:3px}
.typing{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1 data-i="h1"></h1>
    <p class="lede" data-i-html="lede"></p>
  </header>

  <section class="results" aria-label="results">
    <div class="result"><span class="label" data-i="r1Label"></span><span class="value"><span class="from" data-i="r1From"></span><span class="arrow">→</span><span class="to" data-i="r1To"></span></span></div>
    <div class="result"><span class="label" data-i="r2Label"></span><span class="value"><span class="from" data-i="r2From"></span><span class="arrow">→</span><span class="to" data-i="r2To"></span></span></div>
    <div class="result"><span class="label" data-i="r3Label"></span><span class="value"><span class="from" data-i="r3From"></span><span class="arrow">→</span><span class="to" data-i="r3To"></span></span></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2 data-i="simTitle"></h2>
      <div class="controls">
        <button class="primary" id="play" type="button" data-i="replay"></button>
        <span class="clock" id="clock">0.0s</span>
      </div>
    </div>
    <div>
      <div class="eyebrow" data-i="wireLabel" style="margin-bottom:6px"></div>
      <div class="wire" id="wire"></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--surface);border:1px solid var(--line)"></i><span data-i="lgSent"></span></span>
      <span><i style="background:var(--warn-soft)"></i><span data-i="lgDup"></span></span>
      <span><i style="border:1px dashed var(--before)"></i><span data-i="lgLost"></span></span>
      <span><i style="background:var(--after-soft)"></i><span data-i="lgResumed"></span></span>
    </div>
    <div class="sides">
      <div class="side">
        <div class="side-head"><b data-i="before"></b><span class="tag idle" id="b-status"></span></div>
        <div class="bubble" id="b-text"></div>
        <ol class="log" id="b-log"></ol>
      </div>
      <div class="side">
        <div class="side-head"><b data-i="after"></b><span class="tag idle" id="a-status"></span></div>
        <div class="bubble" id="a-text"></div>
        <ol class="log" id="a-log"></ol>
      </div>
    </div>
    <p class="note" data-i="simNote"></p>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px">
    <h2 data-i="changesTitle"></h2>
    <div class="changes">
      <div class="change"><h3 data-i="c1t"></h3><p data-i-html="c1"></p></div>
      <div class="change"><h3 data-i="c2t"></h3><p data-i-html="c2"></p></div>
      <div class="change"><h3 data-i="c3t"></h3><p data-i-html="c3"></p></div>
      <div class="change"><h3 data-i="c4t"></h3><p data-i-html="c4"></p></div>
    </div>
  </section>
  <p class="note" data-i="note"></p>
</div>

<script src="case.js"></script>
<script>
(function () {
  var t = Case.init({
    ko: {
      title: "AI 답변 스트리밍 안정화",
      eyebrow: "WebSocket · AI 채팅 스트리밍",
      h1: "끊겨도 이어지는 AI 답변 스트리밍",
      lede: "AI 답변은 서버가 작은 조각(청크)으로 나눠 실시간으로 보냅니다. 네트워크가 흔들리면 조각이 중복되거나 빠지고, 서버가 멈추면 로딩이 끝나지 않았습니다.<br class=\"wide-br\"> 조각마다 붙은 순번(seq)으로 중복을 거르고, 끊긴 구간은 다시 요청해 이어 받고, 응답이 멈추면 워치독이 대기 상태를 풀도록 바꿨습니다.",
      r1Label: "중복·순서가 뒤바뀐 청크", r1From: "그대로 표시", r1To: "seq로 걸러냄",
      r2Label: "끊긴 동안 놓친 청크", r2From: "답변이 빠짐", r2To: "이어받기",
      r3Label: "서버 응답이 멈췄을 때", r3From: "무한 로딩", r3To: "워치독이 해제",
      simTitle: "같은 상황, 두 클라이언트", replay: "다시 재생",
      wireLabel: "서버가 보낸 이벤트",
      lgSent: "정상 도착", lgDup: "중복 도착", lgLost: "끊김으로 유실", lgResumed: "이어받기로 복구",
      before: "도입 전", after: "도입 후",
      streaming: "답변 중", done: "정리됨", stuck: "로딩이 안 끝남", gap: "[빠짐]",
      simNote: "실제 서비스의 처리 방식을 단순화한 재현입니다. 시간은 빠르게 돌렸고, 워치독 대기 시간도 줄여서 보여 줍니다.",
      evStart: "스트림 시작", evDown: "연결 끊김", evUp: "재연결", evStall: "응답 멈춤",
      lStart: "스트림 시작", lChunk: "seq {n} 받음", lDupShown: "seq {n} 다시 받음 → 그대로 붙임", lDupSkip: "seq {n} ≤ 마지막 seq {last} → 무시",
      lDown: "연결 끊김", lMiss: "seq {n} 못 받음", lUp: "재연결", lResume: "resume_stream(last_received_seq={n}) 요청", lResumed: "seq {n} 이어받음",
      lStill: "완료 신호를 기다리는 중…", lWatchdog: "하트비트 시간 초과 → 대기 해제, 다시 시도 안내",
      changesTitle: "무엇을 바꿨나",
      c1t: "seq 가드", c1: "같은 스트림에서 이미 받은 순번 이하의 청크는 버립니다 (<code>seq &lt;= lastSeq</code>). 재전송이나 재연결로 같은 조각이 다시 와도 글자가 두 번 붙지 않습니다.",
      c2t: "끊긴 구간 이어받기", c2: "재연결되거나 탭으로 돌아오면 마지막으로 받은 순번을 서버에 보내 빠진 조각만 다시 받습니다 (<code>last_received_seq</code>, 최대 200개). 같은 요청이 1.5초 안에 겹치면 한 번만 보냅니다.",
      c3t: "이중 워치독", c3: "첫 응답 대기(서버 설정 + 2초, 최소 5초)와 하트비트(간격 × 3 + 1초, 최소 10초) 두 타이머로 멈춘 스트림을 찾아 로딩을 풉니다. 탭이 숨겨지면 타이머를 멈춰 잘못된 감지를 막습니다.",
      c4t: "3단계 재연결과 전송 대기열", c4: "socket.io 기본 재연결(8회) → 강제 재연결(동시 호출 잠금, 15초 간격) → 지수 백오프(0.8초부터 1.6배, 최대 8초, 30회) 순서로 다시 붙습니다. 끊긴 동안 보낸 메시지는 버리지 않고 대기열에 넣었다가 연결되면 보냅니다.",
      note: "사내 문서와 코드를 바탕으로 정리했습니다. 서비스 이름과 내부 주소는 넣지 않았습니다."
    },
    ja: {
      title: "AI 回答ストリーミングの安定化",
      eyebrow: "WebSocket · AI チャットストリーミング",
      h1: "切れても続く AI 回答ストリーミング",
      lede: "AI の回答はサーバーが小さな断片(チャンク)に分けてリアルタイムに送ります。ネットワークが不安定だと断片が重複したり抜けたりし、サーバーが止まるとローディングが終わりませんでした。<br class=\"wide-br\">断片ごとの通し番号(seq)で重複を除き、抜けた区間は再リクエストして受け取り直し、応答が止まったらウォッチドッグが待機状態を解除するようにしました。",
      r1Label: "重複・順序が逆のチャンク", r1From: "そのまま表示", r1To: "seq で除外",
      r2Label: "切断中に取りこぼしたチャンク", r2From: "回答が欠ける", r2To: "続きから受信",
      r3Label: "サーバー応答が止まったとき", r3From: "無限ローディング", r3To: "ウォッチドッグが解除",
      simTitle: "同じ状況、2つのクライアント", replay: "もう一度再生",
      wireLabel: "サーバーが送ったイベント",
      lgSent: "正常に到着", lgDup: "重複して到着", lgLost: "切断で消失", lgResumed: "再取得で復旧",
      before: "導入前", after: "導入後",
      streaming: "回答中", done: "整理済み", stuck: "ローディングが終わらない", gap: "[欠落]",
      simNote: "実際のサービスの処理を単純化した再現です。時間は速めており、ウォッチドッグの待ち時間も短くしています。",
      evStart: "ストリーム開始", evDown: "切断", evUp: "再接続", evStall: "応答停止",
      lStart: "ストリーム開始", lChunk: "seq {n} 受信", lDupShown: "seq {n} を再受信 → そのまま追加", lDupSkip: "seq {n} ≤ 最後の seq {last} → 無視",
      lDown: "切断", lMiss: "seq {n} を受信できず", lUp: "再接続", lResume: "resume_stream(last_received_seq={n}) を要求", lResumed: "seq {n} を再取得",
      lStill: "完了の合図を待機中…", lWatchdog: "ハートビート超過 → 待機解除、再試行を案内",
      changesTitle: "何を変えたか",
      c1t: "seq ガード", c1: "同じストリームで受信済みの番号以下のチャンクは捨てます (<code>seq &lt;= lastSeq</code>)。再送や再接続で同じ断片が来ても文字が二重になりません。",
      c2t: "抜けた区間の再取得", c2: "再接続やタブ復帰のとき、最後に受け取った番号をサーバーに送り、抜けた断片だけを受け取り直します (<code>last_received_seq</code>、最大 200 件)。1.5 秒以内の重複リクエストは 1 回にまとめます。",
      c3t: "二重のウォッチドッグ", c3: "最初の応答待ち(サーバー設定 + 2 秒、最低 5 秒)とハートビート(間隔 × 3 + 1 秒、最低 10 秒)の 2 つのタイマーで止まったストリームを見つけ、ローディングを解除します。タブが隠れている間はタイマーを止めて誤検知を防ぎます。",
      c4t: "3 段階の再接続と送信キュー", c4: "socket.io 標準の再接続(8 回) → 強制再接続(同時呼び出しをロック、15 秒間隔) → 指数バックオフ(0.8 秒から 1.6 倍、最大 8 秒、30 回)の順でつなぎ直します。切断中に送ったメッセージは捨てずにキューに入れ、接続後に送ります。",
      note: "社内ドキュメントとコードをもとに整理しました。サービス名と内部アドレスは載せていません。"
    }
  });

  var WORDS = {
    ko: ["이차방정식의 ", "근의 공식은 ", "x = ", "(-b ± √(b²-4ac)) ", "/ 2a ", "이고, ", "판별식이 ", "0보다 ", "크면 ", "서로 다른 ", "두 실근을 ", "가집니다."],
    ja: ["二次方程式の", "解の公式は ", "x = ", "(-b ± √(b²-4ac)) ", "/ 2a ", "で、", "判別式が", "0 より", "大きいと", "異なる", "2 つの実数解を", "持ちます。"]
  }[Case.lang];

  // 시나리오: 3번 중복 → 4번 뒤 연결 끊김(5·6 유실) → 재연결 → 끝까지 받지만 완료 신호가 오지 않음
  var STEP = 420;
  var events = [{ at: 0, type: "start" }];
  var time = 400;
  for (var n = 1; n <= WORDS.length; n++) {
    if (n === 5) { events.push({ at: time, type: "down" }); }
    if (n === 5 || n === 6) { events.push({ at: time, type: "lost", seq: n }); time += STEP; continue; }
    if (n === 7) { events.push({ at: time, type: "up" }); time += 260; events.push({ at: time, type: "resume", seqs: [5, 6] }); time += 260; }
    events.push({ at: time, type: "chunk", seq: n });
    if (n === 3) { time += 200; events.push({ at: time, type: "dup", seq: 3 }); }
    time += STEP;
  }
  events.push({ at: time, type: "stall" });
  var WATCHDOG_AT = time + 2600;
  events.push({ at: WATCHDOG_AT, type: "watchdog" });
  var END = WATCHDOG_AT + 400;

  var $ = function (id) { return document.getElementById(id); };
  var wire = $("wire"), clock = $("clock");
  var sides = {
    b: { text: $("b-text"), log: $("b-log"), status: $("b-status") },
    a: { text: $("a-text"), log: $("a-log"), status: $("a-status") }
  };
  var state, idx, start, raf;

  function chip(label, cls) {
    var el = document.createElement("span");
    el.className = "chip " + cls;
    el.textContent = label;
    wire.appendChild(el);
  }
  function setStatus(side, key, cls) {
    sides[side].status.className = "tag " + cls;
    sides[side].status.textContent = t(key);
  }
  function render(side) {
    var s = state[side], el = sides[side].text;
    el.textContent = "";
    s.parts.forEach(function (p) {
      var span = document.createElement("span");
      if (p.cls) span.className = p.cls;
      span.textContent = p.text;
      el.appendChild(span);
    });
    if (s.busy) {
      var dots = document.createElement("span");
      dots.className = "typing";
      dots.innerHTML = "<i></i><i></i><i></i>";
      el.appendChild(dots);
    }
  }
  function stamp(ms) { return (ms / 1000).toFixed(1).padStart(4, " ") + "s"; }

  function apply(ev) {
    var ts = stamp(ev.at), b = state.b, a = state.a;
    switch (ev.type) {
      case "start":
        chip(t("evStart"), "event");
        ["b", "a"].forEach(function (k) { state[k].busy = true; Case.log(sides[k].log, ts, t("lStart"), "info"); setStatus(k, "streaming", "warn"); });
        break;
      case "chunk":
        chip("seq " + ev.seq, "sent");
        b.parts.push({ text: WORDS[ev.seq - 1] }); Case.log(sides.b.log, ts, t("lChunk", { n: ev.seq }));
        if (ev.seq > a.lastSeq) { a.parts.push({ text: WORDS[ev.seq - 1], seq: ev.seq }); a.lastSeq = ev.seq; }
        Case.log(sides.a.log, ts, t("lChunk", { n: ev.seq }));
        break;
      case "dup":
        chip("seq " + ev.seq, "dup");
        b.parts.push({ text: WORDS[ev.seq - 1], cls: "dup" }); Case.log(sides.b.log, ts, t("lDupShown", { n: ev.seq }), "bad");
        Case.log(sides.a.log, ts, t("lDupSkip", { n: ev.seq, last: a.lastSeq }), "good");
        break;
      case "down":
        chip(t("evDown"), "down");
        ["b", "a"].forEach(function (k) { Case.log(sides[k].log, ts, t("lDown"), "bad"); });
        break;
      case "lost":
        chip("seq " + ev.seq, "lost");
        Case.log(sides.b.log, ts, t("lMiss", { n: ev.seq }), "bad");
        Case.log(sides.a.log, ts, t("lMiss", { n: ev.seq }), "bad");
        if (ev.seq === 5) b.parts.push({ text: t("gap") + " ", cls: "gap" });
        break;
      case "up":
        chip(t("evUp"), "event");
        Case.log(sides.b.log, ts, t("lUp"));
        Case.log(sides.a.log, ts, t("lUp"));
        Case.log(sides.a.log, ts, t("lResume", { n: a.lastSeq }), "info");
        break;
      case "resume":
        ev.seqs.forEach(function (n) {
          chip("seq " + n, "resumed");
          a.parts.push({ text: WORDS[n - 1], cls: "resumed" }); a.lastSeq = n;
          Case.log(sides.a.log, ts, t("lResumed", { n: n }), "good");
        });
        break;
      case "stall":
        chip(t("evStall"), "down");
        ["b", "a"].forEach(function (k) { Case.log(sides[k].log, ts, t("lStill")); });
        setStatus("b", "stuck", "before");
        break;
      case "watchdog":
        a.busy = false;
        Case.log(sides.a.log, ts, t("lWatchdog"), "good");
        setStatus("a", "done", "ok");
        break;
    }
    render("b"); render("a");
  }

  function reset() {
    cancelAnimationFrame(raf);
    wire.textContent = "";
    ["b", "a"].forEach(function (k) { sides[k].log.textContent = ""; sides[k].text.textContent = ""; sides[k].status.className = "tag idle"; sides[k].status.textContent = "—"; });
    state = { b: { parts: [], busy: false }, a: { parts: [], busy: false, lastSeq: 0 } };
    idx = 0;
  }
  function frame(now) {
    var elapsed = now - start;
    while (idx < events.length && events[idx].at <= elapsed) apply(events[idx++]);
    clock.textContent = (Math.min(elapsed, END) / 1000).toFixed(1) + "s";
    if (elapsed < END) raf = requestAnimationFrame(frame);
  }
  function play() {
    reset();
    if (Case.reduceMotion) { events.forEach(apply); clock.textContent = (END / 1000).toFixed(1) + "s"; return; }
    start = performance.now();
    raf = requestAnimationFrame(frame);
  }
  $("play").addEventListener("click", play);
  play();
})();
</script>
</body>
</html>
