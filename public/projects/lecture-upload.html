<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 업로드 엔진</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="case.css">
<style>
/* 왼쪽: 페이지를 옮겨 다니는 앱 화면과 떠 있는 업로드 창 / 오른쪽: 엔진의 상태 머신 */
.stage-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
@media (max-width:860px){.stage-wrap{grid-template-columns:1fr}}
.app{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:300px;overflow:hidden;display:flex;flex-direction:column}
.app-tabs{display:flex;gap:2px;padding:8px;border-bottom:1px solid var(--line);background:var(--surface)}
.app-tabs button{font-size:12.5px;padding:5px 10px;border-radius:6px;border:0;background:none;color:var(--muted)}
.app-tabs button.on{background:var(--track);color:var(--ink)}
.app-page{flex:1;padding:14px;display:flex;flex-direction:column;gap:8px}
.app-page .skeleton{height:12px;border-radius:4px;background:var(--track)}
.app-page .title{font-weight:700;font-size:15px}
.float{position:absolute;right:10px;bottom:10px;width:min(260px,calc(100% - 20px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;transition:opacity .2s,transform .2s}
.float[hidden]{display:none}
.float .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.float b{font-size:13px}
.float .muted{color:var(--muted)}
.float .pct{font:600 12px var(--f-mono);font-variant-numeric:tabular-nums}
.fsm{width:100%;height:auto;display:block}
.fsm .st rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.fsm .st text{fill:var(--ink);font:600 11.5px var(--f-mono)}
.fsm .st.on rect{fill:var(--after-soft);stroke:var(--after);stroke-width:2.5}
.fsm .st.on text{fill:var(--after)}
.fsm .st.bad.on rect{fill:var(--before-soft);stroke:var(--before)}
.fsm .st.bad.on text{fill:var(--before)}
.fsm .st.good.on rect{fill:var(--ok-soft);stroke:var(--ok)}
.fsm .st.good.on text{fill:var(--ok)}
.fsm path{fill:none;stroke:var(--line);stroke-width:1.5}
.fsm path.loop{stroke-dasharray:4 4}
.fsm .arrow{fill:var(--line)}
.fsm .cap{font:10.5px var(--f-body);fill:var(--muted)}
.formula{font:12.5px var(--f-mono);background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1 data-i="h1"></h1>
    <p class="lede" data-i-html="lede"></p>
  </header>

  <section class="results">
    <div class="result"><span class="label" data-i="r1Label"></span><span class="value"><span class="from" data-i="r1From"></span><span class="arrow">→</span><span class="to" data-i="r1To"></span></span></div>
    <div class="result"><span class="label" data-i="r2Label"></span><span class="value"><span class="to" data-i="r2To"></span></span><small data-i="r2Sub"></small></div>
    <div class="result"><span class="label" data-i="r3Label"></span><span class="value"><span class="to" data-i="r3To"></span></span><small data-i="r3Sub"></small></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2 data-i="simTitle"></h2>
      <div class="controls">
        <button class="primary" id="start" type="button" data-i="start"></button>
        <button id="nav" type="button" data-i="navigate"></button>
        <button id="cancel" type="button" data-i="cancel"></button>
        <button id="fail" type="button" data-i="fail"></button>
      </div>
    </div>
    <div class="stage-wrap">
      <div class="app" aria-label="app">
        <div class="app-tabs" id="tabs"></div>
        <div class="app-page" id="page"></div>
        <div class="float" id="float" hidden>
          <div class="row"><b id="f-title"></b><span class="pct" id="f-pct">0%</span></div>
          <div class="bar"><i id="f-bar"></i></div>
          <div class="row"><span class="muted" id="f-stage"></span><span class="muted" id="f-item"></span></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
        <svg class="fsm" viewBox="0 0 520 240" role="img" aria-labelledby="fsm-title"><title id="fsm-title" data-i="fsmTitle"></title><g id="fsm"></g></svg>
        <div class="formula" id="formula"></div>
        <ol class="log" id="log"></ol>
      </div>
    </div>
    <p class="note" data-i="simNote"></p>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px">
    <h2 data-i="changesTitle"></h2>
    <div class="changes">
      <div class="change"><h3 data-i="c1t"></h3><p data-i-html="c1"></p></div>
      <div class="change"><h3 data-i="c2t"></h3><p data-i-html="c2"></p></div>
      <div class="change"><h3 data-i="c3t"></h3><p data-i-html="c3"></p></div>
      <div class="change"><h3 data-i="c4t"></h3><p data-i-html="c4"></p></div>
    </div>
  </section>
  <p class="note" data-i="note"></p>
</div>

<script src="case.js"></script>

  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  var LECTURES = [{ name: "1강.mp4", mkv: false }, { name: "2강.mkv", mkv: true }, { name: "3강.mp4", mkv: false }];
  var TABS = t("tabs").split("|");

  /* ── 상태 머신 그림 ── */
  var POS = {
    idle: [6, 20], queued: [134, 20], converting: [262, 20], uploading: [390, 20],
    clipping: [390, 100], registering: [262, 100], success: [134, 100],
    error: [262, 186], cancelled: [390, 186]
  };
  var KEY = { idle: "s_idle", queued: "s_queued", converting: "s_converting", uploading: "s_uploading", clipping: "s_clipping", registering: "s_registering", success: "s_success", error: "s_error", cancelled: "s_cancelled" };
  var boxes = {};
  function el(name, attrs, parent, text) { var n = document.createElementNS(NS, name); Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); }); if (text != null) n.textContent = text; parent.appendChild(n); return n; }
  function drawFsm() {
    var g = $("fsm"); g.textContent = "";
    var defs = el("defs", {}, g);
    var m = el("marker", { id: "ah", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", class: "arrow" }, m);
    var W = 122, H = 34;
    function c(k, side) { var p = POS[k]; if (side === "r") return [p[0] + W, p[1] + H / 2]; if (side === "l") return [p[0], p[1] + H / 2]; if (side === "b") return [p[0] + W / 2, p[1] + H]; return [p[0] + W / 2, p[1]]; }
    function line(a, b, cls) { el("path", { d: "M" + a.join(" ") + " L" + b.join(" "), "marker-end": "url(#ah)", class: cls || "" }, g); }
    line(c("idle", "r"), [POS.queued[0] - 2, POS.queued[1] + H / 2]);
    line(c("queued", "r"), [POS.converting[0] - 2, POS.converting[1] + H / 2]);
    line(c("converting", "r"), [POS.uploading[0] - 2, POS.uploading[1] + H / 2]);
    line(c("uploading", "b"), [POS.clipping[0] + W / 2, POS.clipping[1] - 2]);
    line(c("clipping", "l"), [POS.registering[0] + W + 2, POS.registering[1] + H / 2]);
    line(c("registering", "l"), [POS.success[0] + W + 2, POS.success[1] + H / 2]);
    // 다음 강의로 돌아가는 고리
    el("path", { d: "M " + (POS.clipping[0] + 20) + " " + POS.clipping[1] + " C 380 76, 350 70, " + (POS.converting[0] + W / 2) + " " + (POS.converting[1] + H + 2), "marker-end": "url(#ah)", class: "loop" }, g);
    el("text", { x: 300, y: 84, class: "cap" }, g, t("loopCap"));
    // 성공 후 자동으로 닫히면 idle로
    el("path", { d: "M " + (POS.success[0]) + " " + (POS.success[1] + H / 2) + " C 60 117, 60 80, " + (POS.idle[0] + W / 2) + " " + (POS.idle[1] + H + 2), "marker-end": "url(#ah)", class: "loop" }, g);
    el("text", { x: 134, y: 208, class: "cap" }, g, t("anyCap") + " →");
    Object.keys(POS).forEach(function (k) {
      var grp = el("g", { class: "st" + (k === "error" || k === "cancelled" ? " bad" : k === "success" ? " good" : "") }, g);
      el("rect", { x: POS[k][0], y: POS[k][1], width: W, height: H, rx: 8 }, grp);
      el("text", { x: POS[k][0] + 10, y: POS[k][1] + 21 }, grp, t(KEY[k]));
      boxes[k] = grp;
    });
  }
  function highlight(k) { Object.keys(boxes).forEach(function (b) { boxes[b].classList.toggle("on", b === k); }); }

  /* ── 앱 화면 ── */
  var tab = 1;
  function drawApp() {
    var tabs = $("tabs"); tabs.textContent = "";
    TABS.forEach(function (name, i) { var b = document.createElement("button"); b.type = "button"; b.textContent = name; if (i === tab) b.className = "on"; b.addEventListener("click", function () { go(i); }); tabs.appendChild(b); });
    var page = $("page"); page.textContent = "";
    var h = document.createElement("div"); h.className = "title"; h.textContent = t("pageLine", { p: TABS[tab] }); page.appendChild(h);
    [80, 60, 92, 45, 70].forEach(function (w) { var s = document.createElement("div"); s.className = "skeleton"; s.style.width = w + "%"; page.appendChild(s); });
  }
  function go(i) { tab = i; drawApp(); if (running()) log(t("lNav", { p: TABS[i] }), "info"); }

  /* ── 엔진 ── */
  var job = null, timers = [], startedAt = 0;
  function running() { return job && ["queued", "converting", "uploading", "clipping", "registering"].indexOf(job.stage) >= 0; }
  function stamp() { return ((performance.now() - startedAt) / 1000).toFixed(1).padStart(4, " ") + "s"; }
  function log(text, tone) { Case.log($("log"), stamp(), text, tone); }
  function later(ms, fn) { timers.push(setTimeout(fn, Case.reduceMotion ? 0 : ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  // 실제 computeOverallProgress와 같은 규칙
  function overall(stage, i, n, up) {
    if (stage === "idle" || stage === "queued" || stage === "error" || stage === "cancelled") return 0;
    if (stage === "registering") return 95;
    if (stage === "success") return 100;
    var per = 90 / n, within = stage === "converting" ? 0.1 : stage === "uploading" ? 0.1 + 0.8 * (up / 100) : 0.95;
    return Math.round(per * i + per * within);
  }
  var STAGE_TEXT = { queued: "st_queued", converting: "st_converting", uploading: "st_uploading", clipping: "st_clipping", registering: "st_registering", success: "st_success", error: "st_error", cancelled: "st_cancelled" };

  function set(stage, i, up) {
    job.stage = stage; job.i = i; job.up = up || 0;
    var p = overall(stage, i, LECTURES.length, job.up);
    highlight(stage);
    $("float").hidden = false;
    $("f-title").textContent = t("floatTitle");
    $("f-pct").textContent = p + "%";
    $("f-bar").style.width = p + "%";
    $("f-bar").parentNode.className = stage === "error" || stage === "cancelled" ? "bar before" : "bar";
    $("f-stage").textContent = t(STAGE_TEXT[stage]) + (stage === "uploading" ? " " + job.up + "%" : "");
    $("f-item").textContent = stage === "registering" || stage === "success" ? "" : t("itemOf", { i: Math.min(i + 1, LECTURES.length), n: LECTURES.length });
    $("formula").textContent = t("formula", { p: p });
    buttons();
  }
  function buttons() {
    $("start").disabled = running();
    $("cancel").disabled = !running();
    $("fail").disabled = !running();
  }
  function finish(stage, msg, tone, dismissMs) {
    clearTimers();
    set(stage, job.i, job.up);
    log(msg, tone);
    later(dismissMs, function () { $("float").hidden = true; job.stage = "idle"; highlight("idle"); $("formula").textContent = t("formula", { p: 0 }); log(t("lIdle")); buttons(); });
  }

  function runLecture(i, at) {
    var lec = LECTURES[i];
    if (lec.mkv) {
      later(at, function () { set("converting", i); log(t("lStage", { i: i + 1, s: t("st_converting") + " (" + lec.name + ")" })); });
      at += 900;
    }
    later(at, function () { set("uploading", i, 0); log(t("lStage", { i: i + 1, s: t("st_uploading") })); });
    for (var s = 1; s <= 10; s++) (function (s) { later(at + s * 140, function () { set("uploading", i, s * 10); }); })(s);
    at += 1500;
    later(at, function () { set("clipping", i); log(t("lStage", { i: i + 1, s: t("st_clipping") })); });
    return at + 700;
  }
  function start() {
    clearTimers();
    $("log").textContent = "";
    startedAt = performance.now();
    job = { stage: "queued", i: 0, up: 0 };
    set("queued", 0);
    log(t("lQueued", { n: LECTURES.length }));
    var at = 500;
    for (var i = 0; i < LECTURES.length; i++) at = runLecture(i, at);
    later(at, function () { set("registering", LECTURES.length - 1); log(t("lReg", { n: LECTURES.length })); });
    later(at + 900, function () { finish("success", t("lSuccess"), "good", 4000); });
    // 보여 주기용: 업로드 도중 자동으로 다른 페이지로 이동
    later(2600, function () { go(2); });
    later(5200, function () { go(0); });
  }

  $("start").addEventListener("click", start);
  $("nav").addEventListener("click", function () { go((tab + 1) % TABS.length); });
  $("cancel").addEventListener("click", function () { if (running()) finish("cancelled", t("lCancel"), "bad", 1500); });
  $("fail").addEventListener("click", function () { if (running()) finish("error", t("lError"), "bad", 4000); });

  drawFsm();
  drawApp();
  highlight("idle");
  $("formula").textContent = t("formula", { p: 0 });
  buttons();
  start();
})();
</script>
</body>
</html>
